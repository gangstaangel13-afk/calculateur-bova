
name: Construire APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Extraire le projet
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Fichier ZIP introuvable"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Compiler APK
        working-directory: extracted/CalculateurBovaAndroid
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculateur-Bova-APK
          path: extracted/CalculateurBovaAndroid/app/build/outputs/apk/debug/app-debug.apk
