
name: Construire APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le projet
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$ZIP" -d extracted

      - name: Compiler APK
        working-directory: extracted/CalculateurBovaAndroid
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculateur-Bova-APK
          path: extracted/CalculateurBovaAndroid/app/build/outputs/apk/debug/app-debug.apk
